<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>주도주 스크리너</title>
  <!-- 앱은 /leader/ 아래에 놓이고 "/"로 rewrite 되어 서빙된다. 상대경로 에셋이 두 경로에서 모두 풀리도록 base 고정. -->
  <base href="/leader/" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
  <script src="lib/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="market-switch" id="market-switch" role="tablist" aria-label="시장 선택">
      <button class="mkt is-active" data-market="kr" role="tab" aria-selected="true">🇰🇷 한국</button>
      <button class="mkt" data-market="us" role="tab" aria-selected="false">🇺🇸 미국</button>
      <button class="mkt" data-market="cn" role="tab" aria-selected="false">🇨🇳 중국</button>
    </div>
    <div class="topbar-row">
      <h1>주도주 <span class="accent">스크리너</span></h1>
      <span id="as-of" class="as-of"></span>
    </div>
    <div id="badges" class="badges"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="entries">초입 <span id="n-entries" class="count"></span></button>
    <button class="tab" data-tab="leading">진행 <span id="n-leading" class="count"></span></button>
    <button class="tab" data-tab="longrun">장기 <span id="n-longrun" class="count"></span></button>
    <button class="tab" data-tab="exits">이탈 <span id="n-exits" class="count"></span></button>
    <button class="tab" id="tab-exports" data-tab="exports">🚢 수출</button>
    <button class="tab" data-tab="coins">🪙 코인</button>
    <button class="tab" data-tab="research">🔬 리서치</button>
    <button class="tab" data-tab="credit">💳 신용잔고</button>
    <button class="tab" data-tab="method">📖 법칙</button>
  </nav>

  <main id="list" class="list"></main>

  <section id="detail" class="detail" hidden>
    <button id="back" class="back">‹ 목록</button>
    <div id="detail-head" class="detail-head"></div>
    <div class="chart-wrap">
      <div id="chart" class="chart"></div>
      <button id="scale-toggle" class="scale-toggle" type="button" aria-pressed="false" title="로그/선형 스케일 전환">로그</button>
    </div>
    <div id="legend" class="legend"></div>
    <div id="detail-note" class="detail-note"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
